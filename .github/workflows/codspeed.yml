name: CodSpeed

on:
  push:
    branches:
      - master
  pull_request:
  # Permet à CodSpeed de déclencher une analyse rétroactive pour constituer
  # les premières données de référence.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # authentification OpenID Connect auprès de CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: npm run bench
